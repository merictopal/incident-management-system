# Only the client and the API gateway are published to the host.
# The four microservices are reachable only inside the Docker network,
# so nobody can bypass the gateway or call the /internal endpoints directly.

x-backend-env: &backend-env
  Jwt__SigningKey: ${JWT_SIGNING_KEY:-docker-dev-signing-key-change-me-0123456789}
  Internal__ApiKey: ${INTERNAL_API_KEY:-docker-dev-internal-api-key}

services:
  client:
    build: ./client
    ports: ["5173:5173"]
    environment:
      PUBLIC_API_URL: http://localhost:5000
    depends_on: [api-gateway]
    restart: unless-stopped

  api-gateway:
    build: { context: ., dockerfile: api-gateway/Dockerfile }
    ports: ["5000:8080"]
    environment:
      Cors__AllowedOrigins__0: http://localhost:5173
    depends_on: [user-service, incident-service, notification-service, monitoring-service]
    restart: unless-stopped

  user-service:
    build: { context: ., dockerfile: services/user-service/Dockerfile }
    environment: *backend-env
    restart: unless-stopped

  incident-service:
    build: { context: ., dockerfile: services/incident-service/Dockerfile }
    environment:
      <<: *backend-env
      Services__NotificationService__BaseUrl: http://notification-service:8080
    restart: unless-stopped

  notification-service:
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    environment: *backend-env
    restart: unless-stopped

  monitoring-service:
    build: { context: ., dockerfile: services/monitoring-service/Dockerfile }
    environment:
      <<: *backend-env
      Services__UserService__BaseUrl: http://user-service:8080
      Services__IncidentService__BaseUrl: http://incident-service:8080
      Services__NotificationService__BaseUrl: http://notification-service:8080
    restart: unless-stopped
